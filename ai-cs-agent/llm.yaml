# LLM 接入配置
#
# - active：启用哪个 provider（可被环境变量 LLM_PROVIDER 覆盖）
# - providers.<name>.type：适配器类型
#     anthropic = Claude 系列
#     openai    = OpenAI 官方 API 及一切 OpenAI 兼容协议（如 DeepSeek，仅 base_url 不同）
# - api_key / base_url 支持 ${ENV_VAR} 占位：密钥放 .env，不要写进本文件
#
# 切换模型：改 active，或运行时 LLM_PROVIDER=openai uv run ...

active: anthropic

providers:
  anthropic:
    type: anthropic
    model: claude-fable-5        # 受限时换 claude-opus-4-8
    api_key: ${ANTHROPIC_API_KEY}
    max_tokens: 4096

  openai:
    type: openai
    model: gpt-4o
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    max_tokens: 4096

  deepseek:
    type: openai                 # DeepSeek 走 OpenAI 兼容协议
    model: deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    max_tokens: 4096
