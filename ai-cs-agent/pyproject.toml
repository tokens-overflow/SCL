[project]
name = "ai-cs-agent"
version = "0.1.0"
description = "AI 客服 Agent + CRM Demo —— 基于 Anthropic tool use 的电商客服智能体"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "nicegui>=2.7.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
