active: ds-flash

providers:

  # --------------------------------------------------------------------- AWS
  bedrock:
    type: bedrock
    model: jp.anthropic.claude-sonnet-4-6
    aws_access_key_id: ${AWS_ACCESS_KEY_ID}
    aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    region_name: ap-northeast-1

  # --------------------------------------------------------------- Anthropic
  anthropic:
    type: anthropic
    model: claude-sonnet-4-20250514
    api_key: ${ANTHROPIC_API_KEY}
    # base_url: https://api.deepseek.com/anthropic   # 改走 DeepSeek anthropic 兼容端点

  # ------------------------------------------------------------------ OpenAI
  openai:
    type: openai
    model: gpt-4o
    api_key: ${OPENAI_API_KEY}
    # base_url: ""

  # ---------------------------------------------------------------- DeepSeek
  # 官方接口（OpenAI 兼容）：https://api.deepseek.com
  # 可选模型：
  #   - deepseek-v4-flash   ：快速通用
  #   - deepseek-v4-pro     ：更强推理
  #   - deepseek-chat       ：legacy，2026/07/24 弃用 = v4-flash 非思考
  #   - deepseek-reasoner   ：legacy，2026/07/24 弃用 = v4-flash 思考
  deepseek:
    type: deepseek
    model: deepseek-v4-flash
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com

  # 便捷别名（节名 ≠ adapter type，必须显式声明 type: deepseek）
  ds-flash:
    type: deepseek
    model: deepseek-v4-flash
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com

  ds-pro:
    type: deepseek
    model: deepseek-v4-pro
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
