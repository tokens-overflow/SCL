name: Materialize Penguin Icon

on:
  push:
    branches:
      - agent/update-classic-penguin-icon
    paths:
      - 'claude-code-2007/icon-new.base64'
      - '.github/workflows/materialize-penguin-icon.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-classic-penguin-icon
          fetch-depth: 0
      - name: Decode icon and clean temporary files
        shell: bash
        run: |
          base64 --decode claude-code-2007/icon-new.base64 > claude-code-2007/icon.png
          rm claude-code-2007/icon-new.base64
          rm .github/workflows/materialize-penguin-icon.yml
      - name: Commit generated icon
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: use classic penguin app icon'
          git push origin HEAD:agent/update-classic-penguin-icon
