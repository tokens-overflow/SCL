name: Claude Code 2007 Refactor

on:
  push:
    branches:
      - agent/refactor-claude-code-2007-modules
  pull_request:
    paths:
      - 'claude-code-2007/**'
      - '.github/workflows/claude-code-2007-refactor.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-code-2007
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile server.py backend/*.py
      - name: JavaScript syntax
        run: |
          node --check frontend/api.js
          node --check frontend/chat.js
          node --check frontend/tasks.js
          node --check frontend/scheduler.js
      - name: Smoke tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
